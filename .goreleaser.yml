version: 2

builds:
  - main: ./cmd/webull
    binary: webull
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/webull-inc/webull-openapi-cli/pkg/version.Version={{.Version}}
      - -X github.com/webull-inc/webull-openapi-cli/pkg/version.GitCommit={{.ShortCommit}}
      - -X github.com/webull-inc/webull-openapi-cli/pkg/version.BuildTime={{.Date}}

archives:
  - formats: tar.gz
    format_overrides:
      - goos: windows
        formats: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
